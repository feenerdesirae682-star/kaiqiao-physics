<!doctype html>
<html lang="zh-cmn-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>百大大招库 · 开窍物理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav"></div>

<header style="padding:72px 0 56px;border-bottom:1px solid var(--hair);">
  <div class="wrap">
    <div style="display:grid;grid-template-columns:1fr auto;align-items:end;gap:32px;">
      <div>
        <div class="kicker" style="margin-bottom:18px;">§ 02 · 理论体系 / COMPENDIUM</div>
        <h1 class="h2" style="margin:0 0 18px;">百大大招库 <em style="font-style:italic;color:var(--vermillion);font-family:var(--serif-en);font-weight:500;">— A Method Compendium</em></h1>
        <p style="font-family:var(--serif);font-size:18px;line-height:1.7;color:var(--ink-2);max-width:680px;margin:0;">覆盖初高中全学段，170+ 个独家提炼的母题模型。每一招都附核心痛点、母题推演、秒杀总结，配合真题落实。</p>
      </div>
      <div class="mono" style="font-size:11px;color:var(--ink-3);letter-spacing:0.14em;text-align:right;">
        <div>第 25/26 学期编</div>
        <div style="margin-top:4px;">© 开窍物理教研</div>
      </div>
    </div>
  </div>
</header>

<!-- toolbar -->
<div style="position:sticky;top:65px;z-index:30;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--hair);">
  <div class="wrap">
    <div style="padding:14px 0;display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;">
      <div style="display:flex;gap:0;border:1px solid var(--ink);">
        <button id="gr-junior" onclick="setGrade('junior')" style="padding:10px 22px;font-family:var(--serif);font-weight:600;font-size:14.5px;background:transparent;color:var(--ink-2);border:0;border-right:1px solid var(--ink);">初中提分大招</button>
        <button id="gr-senior" onclick="setGrade('senior')" style="padding:10px 22px;font-family:var(--serif);font-weight:600;font-size:14.5px;background:var(--ink);color:var(--paper);border:0;">高中绝密神技</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex:1;max-width:480px;border:1px solid var(--hair-strong);background:var(--paper);padding:0 14px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--ink-3);"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg>
        <input id="search" placeholder="搜索：知三求二、电表变化量..." style="flex:1;border:0;padding:11px 0;background:transparent;font-family:var(--serif);font-size:15px;color:var(--ink);outline:none;">
      </div>
      <div class="mono" style="font-size:11px;color:var(--ink-3);letter-spacing:0.12em;"><span id="count">0</span> · 招</div>
    </div>
  </div>
</div>

<main style="padding:48px 0 96px;">
  <div class="wrap">
    <div id="cats" style="display:grid;grid-template-columns:1fr 1fr;gap:48px;"></div>
    <div id="empty" style="display:none;text-align:center;padding:80px 0;color:var(--ink-3);font-family:var(--serif);font-size:17px;">未找到匹配的大招</div>
  </div>
</main>

<div id="footer"></div>

<div id="tech-modal" class="modal-back" onclick="closeModal('tech-modal')">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <button class="modal-close" onclick="closeModal('tech-modal')">✕</button>
      <div id="tech-modal-chips" style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;"></div>
      <h3 id="tech-modal-title"></h3>
      <div id="tech-modal-tagline" class="tagline"></div>
    </div>
    <div class="modal-body" id="tech-modal-body"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="shared.js"></script>
<script>
document.getElementById('nav').innerHTML = renderNav('techniques');
document.getElementById('footer').innerHTML = renderFooter();

let grade = new URLSearchParams(location.search).get('g') || 'senior';
let query = new URLSearchParams(location.search).get('q') || '';
document.getElementById('search').value = query;

function setGrade(g) {
  grade = g;
  document.getElementById('gr-junior').style.background = g==='junior'?'var(--ink)':'transparent';
  document.getElementById('gr-junior').style.color = g==='junior'?'var(--paper)':'var(--ink-2)';
  document.getElementById('gr-senior').style.background = g==='senior'?'var(--ink)':'transparent';
  document.getElementById('gr-senior').style.color = g==='senior'?'var(--paper)':'var(--ink-2)';
  render();
}
window.setGrade = setGrade;
setGrade(grade);

document.getElementById('search').addEventListener('input', e => { query = e.target.value.trim(); render(); });

function render() {
  const cats = grade === 'junior' ? KAIQIAO.juniorCategories : KAIQIAO.seniorCategories;
  let total = 0;
  const html = cats.map((cat, ci) => {
    const filtered = query ? cat.items.filter(x => x.includes(query)) : cat.items;
    total += filtered.length;
    if (!filtered.length) return '';
    return `<section style="break-inside:avoid;">
      <header style="display:flex;align-items:baseline;gap:14px;padding-bottom:14px;border-bottom:1.5px solid var(--ink);margin-bottom:18px;">
        <span class="mono" style="font-size:11px;letter-spacing:0.16em;color:var(--vermillion);text-transform:uppercase;">Vol. ${String.fromCharCode(8544+ci)}</span>
        <h3 style="font-family:var(--serif);font-size:24px;font-weight:700;margin:0;letter-spacing:-0.01em;">${cat.title}</h3>
        <span style="flex:1;height:1px;background:var(--hair);"></span>
        <span class="mono" style="font-size:11px;color:var(--ink-3);letter-spacing:0.1em;">${filtered.length}</span>
      </header>
      <div style="font-family:var(--serif);font-size:13.5px;color:var(--ink-3);font-style:italic;margin:-12px 0 18px;">${cat.sub}</div>
      <ol style="list-style:none;padding:0;margin:0;">
        ${filtered.map((t,i) => {
          const detail = KAIQIAO.techDetail[t];
          const num = String(i+1).padStart(2,'0');
          return `<li><a href="#" onclick="event.preventDefault();openTech('${t.replace(/'/g,"\\'")}')" style="display:grid;grid-template-columns:38px 1fr auto;gap:14px;align-items:baseline;padding:14px 0;border-bottom:1px dotted var(--hair);text-decoration:none;color:inherit;transition:all .2s;" onmouseover="this.style.paddingLeft='8px';this.style.background='var(--paper-2)'" onmouseout="this.style.paddingLeft='0';this.style.background='transparent'">
            <span class="mono" style="font-size:11px;color:var(--ink-3);letter-spacing:0.08em;">${String.fromCharCode(8544+ci)}.${num}</span>
            <span><div style="font-family:var(--serif);font-size:17px;font-weight:500;line-height:1.4;letter-spacing:-0.005em;">${t}</div>${detail?`<div style="font-family:var(--serif);font-size:13.5px;color:var(--ink-3);margin-top:3px;font-style:italic;">${detail.tagline}</div>`:''}</span>
            <span style="font-family:var(--serif);color:${detail?'var(--vermillion)':'var(--ink-4)'};font-size:14px;">${detail?'阅 →':'未编'}</span>
          </a></li>`;
        }).join('')}
      </ol>
    </section>`;
  }).join('');
  document.getElementById('cats').innerHTML = html;
  document.getElementById('count').textContent = total;
  document.getElementById('empty').style.display = total ? 'none' : 'block';
}
render();

function openModal(id) { document.getElementById(id).classList.add('open'); document.body.style.overflow='hidden'; }
function closeModal(id) { document.getElementById(id).classList.remove('open'); document.body.style.overflow=''; }
window.openModal = openModal; window.closeModal = closeModal;

function openTech(name) {
  const d = KAIQIAO.techDetail[name];
  document.getElementById('tech-modal-title').textContent = name;
  if (!d) {
    document.getElementById('tech-modal-tagline').textContent = '此大招的详细推演为内部教研资料';
    document.getElementById('tech-modal-chips').innerHTML = `<span class="chip">未公开</span>`;
    document.getElementById('tech-modal-body').innerHTML = `<div class="modal-section"><h4>说明</h4><p>该大招的完整变量代换公式、典型例题与真题实战录像为开窍物理内部教研资料，本站仅作目录展示。</p></div>`;
    openModal('tech-modal'); return;
  }
  document.getElementById('tech-modal-tagline').textContent = d.tagline;
  document.getElementById('tech-modal-chips').innerHTML = `<span class="chip red">理论大招</span><span class="chip">${d.time.after}</span>`;
  document.getElementById('tech-modal-body').innerHTML = `
    <div class="modal-section"><h4>核心痛点</h4><p>${d.explanation}</p></div>
    <div class="modal-section"><h4>母题与推演</h4><div class="pre">${d.example}</div></div>
    <div class="modal-section summary"><h4 style="color:var(--vermillion);">开窍秒杀总结</h4><div class="pre">${d.summary}</div></div>
    <div style="display:flex;gap:24px;padding:18px 22px;background:var(--paper-2);border:1px solid var(--hair);align-items:center;">
      <div style="flex:1;"><div class="kicker">传统</div><div style="font-family:var(--serif);font-size:16px;margin-top:4px;text-decoration:line-through;color:var(--ink-3);">${d.time.before}</div></div>
      <div style="font-family:var(--serif);font-size:22px;color:var(--vermillion);">→</div>
      <div style="flex:1;"><div class="kicker" style="color:var(--vermillion);">开窍</div><div style="font-family:var(--serif);font-size:16px;margin-top:4px;color:var(--vermillion);font-weight:600;">${d.time.after}</div></div>
    </div>
    <div style="text-align:right;margin-top:24px;"><a href="questions.html" class="btn ghost">查阅对应真题 →</a></div>
  `;
  openModal('tech-modal');
}
window.openTech = openTech;
</script>
</body>
</html>
